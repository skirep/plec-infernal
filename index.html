<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#271c26">
  <meta name="description" content="Plec Infernal, un FPS retro de Dejoco Arts fet de paper i tinta.">
  <title>Plec Infernal · Dejoco Arts</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./game.js?v=2"></script>
</head>
<body>
  <main id="game">
    <canvas id="world" aria-label="Vista en primera persona"></canvas>
    <header class="brand"><span class="brand-icon" aria-hidden="true"></span> DEJOCO ARTS</header>
    <button class="sound utility" id="sound" aria-pressed="true">So activat</button>
    <section id="menu" class="overlay menu" aria-labelledby="game-title">
      <div class="cover">
        <p class="imprint">Un joc de trets de paper i tinta</p>
        <h1 id="game-title">PLEC<br><em>INFERNAL</em></h1>
        <p class="premise">La impremta ha pres vida. Travessa les seves pàgines abans que et tanqui a dins.</p>
        <div class="menu-actions">
          <button id="start" class="primary" disabled>Preparant el joc…</button>
          <button id="browse" class="secondary" disabled>Tria un nivell</button>
        </div>
        <div class="tally"><span>30 nivells</span><span>14 monstres</span><span>7 armes</span></div>
      </div>
    </section>
    <dialog id="levels" aria-labelledby="levels-title">
      <div class="dialog-head"><h2 id="levels-title">Tria un nivell</h2><button id="close-levels" class="close" aria-label="Tanca">×</button></div>
      <div id="level-list"></div>
    </dialog>
    <section id="interlude" class="overlay" hidden>
      <div class="paper">
        <p class="imprint" id="interlude-kicker"></p>
        <h2 id="interlude-title"></h2>
        <p id="interlude-copy"></p>
        <p id="help" class="help"></p>
        <div class="menu-actions">
          <button id="advance" class="primary"></button>
          <button id="home" class="secondary">Menú principal</button>
        </div>
      </div>
    </section>
    <div id="hud" hidden>
      <div class="mission"><p id="location"></p><strong id="objective"></strong></div>
      <div class="tools"><button class="utility" id="map-toggle" aria-pressed="false">Mapa</button><button class="utility" id="pause">Pausa</button></div>
      <canvas id="minimap" width="150" height="150" hidden aria-label="Mapa del nivell"></canvas>
      <div class="status">
        <div><small>VIDA</small><b id="health">100</b></div>
        <div><small>ARMADURA</small><b id="armor">0</b></div>
        <div class="equipment"><small id="weapon-name"></small><b id="ammo"></b></div>
      </div>
      <div id="notice" role="status"></div>
      <div id="touch" hidden>
        <div id="stick" aria-label="Joystick de moviment"><span></span></div>
        <div class="touch-actions"><button id="switch" aria-label="Canvia d'arma">ARMA</button><button class="fire" id="fire" aria-label="Dispara">FOC</button></div>
      </div>
    </div>
    <noscript>Cal activar el JavaScript per jugar.</noscript>
  </main>
</body>
</html>
